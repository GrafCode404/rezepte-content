name: Regenerate recipes index

on:
  push:
    branches: [main]
    paths:
      - "recipes/**"
      - "!recipes/index.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Regenerate index.json and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Der Checkout steht auf dem auslösenden Commit (die .md-Änderung).
          # Der Editor schreibt parallel oft schon eine neue index.json – deshalb
          # erst auf den neuesten Stand ziehen, bevor wir neu generieren.
          git pull --rebase
          python generate_index.py
          git add recipes/index.json
          if git diff --cached --quiet; then
            echo "index.json unverändert – kein Commit nötig"
          else
            git commit -m "Regenerate recipes index.json"
            git push
          fi
